<!-- 1. Vos réglages (Firebase, serveur IA, serveurs d'appel) -->

<!-- 2. Firebase n'est chargé que si config.js le demande -->
<script>
if((window.LISANGA_CONFIG||{}).firebase&&window.LISANGA_CONFIG.firebase.apiKey){
  ['app','auth','firestore'].forEach(function(m){document.write('<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-'+m+'-compat.js"><\/script>')});
}
</script>
<!-- 3. Le moteur de l'application : l'ordre est important -->
